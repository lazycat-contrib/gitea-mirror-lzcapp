version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/gitea-mirror.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: gitea-mirror

build:
  run_buildscript: false

images:
  - id: gitea-mirror
    target: service
    service: gitea-mirror
    source: ghcr.io/raylabshq/gitea-mirror
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Gitea Mirror
    summary: "自动将 GitHub 仓库同步到自托管 Gitea/Forgejo"
